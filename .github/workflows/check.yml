name: Integration checks
on:
  push:
    branches: [main, 'rsi/runtime/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-linux-tests.txt
      - name: Install isolated desktop bootstrap dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tigervnc-standalone-server xauth x11-utils websockify novnc socat openbox python3-gi gir1.2-gtk-3.0 python3-pyqt5
      - run: python -B scripts/check.py --linux
      - name: Check native DSH plugin contract
        run: node --test plugins/dsh-rsi-wechat-status/test/*.test.js
      - name: Rehearse cancellation in an isolated Qt and Openbox desktop
        run: /usr/bin/python3 -B scripts/rehearse_composer_cleanup.py --execute
