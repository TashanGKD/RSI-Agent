<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>登录 · 他山共同记事本</title>
  <link rel="stylesheet" href="/auth.css">
  <script src="/auth.js?v=20261023-origin" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wordmark" aria-label="他山 Tashan">
      <span class="wordmark-cn">他山</span>
      <span class="wordmark-en">TASHAN</span>
    </div>
    <span class="header-caption">共同记事本</span>
  </header>
  <main class="auth-layout">
    <aside class="auth-story" aria-label="共同记事本">
      <div class="story-rule" aria-hidden="true"></div>
      <p class="eyebrow">YOUR NOTEBOOK</p>
      <h2>留一笔，<br>接着做。</h2>
      <p class="story-copy">事情有来处，进展有记录。<br>在这里，接上自己的思路。</p>
      <div class="notebook-lines" aria-hidden="true"><i></i><i></i><i></i></div>
    </aside>
    <section class="auth-panel" aria-labelledby="auth-title">
      <p class="panel-label"><span class="private-dot" aria-hidden="true"></span>私人记事本</p>
      <h1 id="auth-title">正在连接记事本</h1>
      <p id="auth-description" class="auth-description">请稍候，正在准备登录。</p>
      <form id="auth-form" novalidate hidden aria-busy="false">
        <div id="username-field" class="field" hidden>
          <label for="username">账号</label>
          <input id="username" name="username" type="text" minlength="3" maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false" disabled>
        </div>
        <div class="field">
          <label id="password-label" for="password">登录密码</label>
          <input id="password" name="password" type="password" minlength="8" maxlength="256" required
                 autocomplete="current-password" aria-describedby="password-hint auth-feedback" disabled>
          <p id="password-hint" class="field-hint">至少 8 个字符，最多 256 个字符。</p>
        </div>
        <div id="confirm-field" class="field" hidden>
          <label for="password-confirm">再次输入密码</label>
          <input id="password-confirm" name="password-confirm" type="password" minlength="8" maxlength="256"
                 autocomplete="new-password" aria-describedby="auth-feedback" disabled>
        </div>
        <button id="auth-submit" class="primary-button" type="submit" disabled>
          <span id="submit-label">进入记事本</span>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4"/></svg>
        </button>
      </form>
      <div id="auth-feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true">正在连接，请稍候。</div>
      <button id="auth-retry" class="retry-button" type="button" hidden>重新连接</button>
      <p class="owner-note">仅本人使用 · 手机与电脑共享同一本记录</p>
      <noscript><p class="feedback is-error">请启用浏览器的 JavaScript 后登录。</p></noscript>
    </section>
  </main>
  <footer class="site-footer"><span>他山 · 共同记事本</span><span class="footer-rule" aria-hidden="true"></span><span>把事情记清楚</span></footer>
</body>
</html>
