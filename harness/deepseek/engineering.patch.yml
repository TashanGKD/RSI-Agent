# Owner engineering only: structured file tools and read-only web fetch.
# Chat keeps none of these; harness/deepseek/chat.patch.yml still removes them.
# No search provider is configured, so only web_fetch is exposed.
- id: tool-fs
  config:
    read: true
    readImage: true
    write: true
    edit: true
- insert:
    - id: web
      name: '@deepseek-ai/dsh-web'
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: true
        search: false
